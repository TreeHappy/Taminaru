# Tinty config for Taminaru
# https://github.com/tinted-theming/tinty

scheme_dir = "~/.local/share/tinted-theming/schemes"

[[items]]
name = "ghostty"
path = "https://github.com/tinted-theming/tinted-terminal"
themes-dir = "themes/ghostty"
supported-systems = ["base16", "base24"]
hook = """
mkdir -p ~/.config/ghostty/themes
command cp -f "$TINTY_THEME_FILE_PATH" ~/.config/ghostty/themes/tinted-theming
killall -SIGUSR2 ghostty 2>/dev/null || true
"""

[[items]]
name = "wezterm"
path = "https://github.com/tinted-theming/tinted-terminal"
themes-dir = "themes/wezterm"
supported-systems = ["base16", "base24"]
hook = """
SRC="$HOME/.local/share/tinted-theming/tinty/repos/tinted-wezterm/themes/wezterm"
WEZTERM_DIR="$HOME/.config/wezterm"
if [ -d "$SRC" ]; then
    mkdir -p "$WEZTERM_DIR"
    ln -sfn "$SRC" "$WEZTERM_DIR/colors"
    touch -c "$WEZTERM_DIR/wezterm.lua"
fi
"""

[[items]]
name = "vim"
path = "https://github.com/tinted-theming/tinted-vim"
themes-dir = "colors"
supported-systems = ["base16", "base24"]

[[items]]
name = "yazi"
path = "https://github.com/tinted-theming/tinted-yazi"
themes-dir = "themes"
supported-systems = ["base16", "base24"]

[[items]]
name = "fish"
path = "https://github.com/tinted-theming/tinted-shell"
themes-dir = "fish"
supported-systems = ["base16", "base24"]

[[items]]
name = "fzf"
path = "https://github.com/tinted-theming/tinted-fzf"
themes-dir = "fzf"
supported-systems = ["base16", "base24"]

[[items]]
name = "vivid"
path = "https://github.com/tinted-theming/base16-vivid"
themes-dir = "themes"
supported-systems = ["base16"]

# Tools without official templates — custom hooks

[[items]]
name = "starship"
path = "https://github.com/tinted-theming/tinted-shell"
themes-dir = "fish"
supported-systems = ["base16", "base24"]
hook = "bash ~/.config/tinty/hooks/starship-hook.sh"

[[items]]
name = "bat"
path = "https://github.com/tinted-theming/tinted-terminal"
themes-dir = "themes/ghostty"
supported-systems = ["base16", "base24"]
hook = """
mkdir -p ~/.config/bat/themes
"""

[[items]]
name = "psreadline"
path = "https://github.com/tinted-theming/tinted-shell"
themes-dir = "fish"
supported-systems = ["base16", "base24"]
hook = "bash ~/.config/tinty/hooks/psreadline-hook.sh"
